name: Relevo
options:
  bundleIdPrefix: io.github.lancaster2995
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  Relevo:
    type: application
    platform: iOS
    sources:
      - Relevo
    info:
      path: Relevo/Info.plist
      properties:
        CFBundleDisplayName: Relevo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Para usar el modo de voz de Claude en la sesión de una cuenta.
        NSCameraUsageDescription: Para adjuntar fotos a Claude desde la cámara.
        NSPhotoLibraryAddUsageDescription: Para guardar imágenes que descargues de Claude.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lancaster2995.relevo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  RelevoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RelevoTests
    dependencies:
      - target: Relevo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lancaster2995.relevo.tests
schemes:
  Relevo:
    build:
      targets:
        Relevo: all
        RelevoTests: [test]
    test:
      targets:
        - RelevoTests
