name: Build APK

on:
  push:
    paths-ignore:
      - 'dist/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Relevo.apk

      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest'

      - name: Version
        id: version
        run: echo "name=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Relevo-${{ steps.version.outputs.name }}
          path: Relevo.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Commit APK and screenshots
        if: github.event_name == 'push'
        run: |
          mkdir -p dist docs/screens
          cp Relevo.apk dist/Relevo.apk
          cp app/build/screens/*.png docs/screens/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Relevo.apk
          git add docs/screens 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update dist/Relevo.apk and screenshots (CI build ${GITHUB_SHA::7})"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Branch moved on; the next build will update dist/"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Relevo ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Relevo.apk
          body: |
            APK de Relevo compilado por GitHub Actions desde `${{ github.sha }}`.
            Descarga **Relevo.apk** en el teléfono, ábrelo y permite instalar apps de este origen.
