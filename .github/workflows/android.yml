name: Build APK

on:
  push:
    paths-ignore:
      - 'dist/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Relevo.apk

      - name: Version
        id: version
        run: echo "name=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Relevo-${{ steps.version.outputs.name }}
          path: Relevo.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Relevo ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Relevo.apk
          body: |
            APK de Relevo compilado por GitHub Actions desde `${{ github.sha }}`.
            Descarga **Relevo.apk** en el teléfono, ábrelo y permite instalar apps de este origen.
